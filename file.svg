// This is your Prisma schema file,
// learn more about it in the docs: https://pris.ly/d/prisma-schema

generator client {
  provider = "prisma-client-js"
}

datasource db {
  provider = "postgresql"
}

enum UserRole {
  CUSTOMER
  PROVIDER
  ADMIN
}

enum BookingStatus {
  PENDING
  CONFIRMED
  IN_PROGRESS
  COMPLETED
  CANCELLED
}

enum PaymentStatus {
  PENDING
  PAID
  FAILED
  REFUNDED
}

enum PaymentMethod {
  CASH
  STRIPE
  EASYPAISA
  JAZZCASH
}

model User {
  id            String    @id @default(cuid())
  name          String?
  email         String?   @unique
  emailVerified DateTime?
  image         String?
  phone         String?   @unique
  role          UserRole  @default(CUSTOMER)
  createdAt     DateTime  @default(now())
  updatedAt     DateTime  @updatedAt

  // For Providers
  providerProfile ProviderProfile?

  // Relationships
  bookings        Booking[]
  reviews         Review[]
  notifications   Notification[]
}

model ProviderProfile {
  id            String   @id @default(cuid())
  userId        String   @unique
  user          User     @relation(fields: [userId], references: [id])
  businessName  String?
  bio           String?
  isVerified    Boolean  @default(false)
  rating        Float    @default(0)
  totalReviews  Int      @default(0)
  
  // Services offered by provider
  services      Service[] @relation("ProviderServices")
  
  createdAt     DateTime @default(now())
  updatedAt     DateTime @updatedAt
}

model Category {
  id          String    @id @default(cuid())
  name        String    @unique
  slug        String    @unique
  icon        String?
  description String?
  services    Service[]
  createdAt   DateTime  @default(now())
  updatedAt   DateTime  @updatedAt
}

model Service {
  id          String    @id @default(cuid())
  name        String
  slug        String    @unique
  description String
  basePrice   Float
  imageUrl    String?
  categoryId  String
  category    Category  @relation(fields: [categoryId], references: [id])
  
  // Features / What's included
  features    String[]
  
  // Relationships
  providers   ProviderProfile[] @relation("ProviderServices")
  bookings    Booking[]
  reviews     Review[]
  
  createdAt   DateTime @default(now())
  updatedAt   DateTime @updatedAt
}

model Booking {
  id            String        @id @default(cuid())
  bookingNumber String        @unique
  customerId    String
  customer      User          @relation(fields: [customerId], references: [id])
  serviceId     String
  service       Service       @relation(fields: [serviceId], references: [id])
  
  area          String        // Multan Area
  address       String
  date          DateTime
  timeSlot      String
  notes         String?
  
  status        BookingStatus @default(PENDING)
  totalAmount   Float
  
  payment       Payment?
  review        Review?
  
  createdAt     DateTime      @default(now())
  updatedAt     DateTime      @updatedAt
}

model Payment {
  id            String        @id @default(cuid())
  bookingId     String        @unique
  booking       Booking       @relation(fields: [bookingId], references: [id])
  amount        Float
  method        PaymentMethod
  status        PaymentStatus @default(PENDING)
  transactionId String?
  
  createdAt     DateTime      @default(now())
  updatedAt     DateTime      @updatedAt
}

model Review {
  id          String   @id @default(cuid())
  rating      Int
  comment     String?
  userId      String
  user        User     @relation(fields: [userId], references: [id])
  serviceId   String
  service     Service  @relation(fields: [serviceId], references: [id])
  bookingId   String   @unique
  booking     Booking  @relation(fields: [bookingId], references: [id])
  
  createdAt   DateTime @default(now())
  updatedAt   DateTime @updatedAt
}

model Notification {
  id        String   @id @default(cuid())
  userId    String
  user      User     @relation(fields: [userId], references: [id])
  title     String
  message   String
  isRead    Boolean  @default(false)
  createdAt DateTime @default(now())
}

model Coupon {
  id          String    @id @default(cuid())
  code        String    @unique
  discount    Float     // Percentage or Fixed
  isPercent   Boolean   @default(true)
  expiryDate  DateTime?
  isActive    Boolean   @default(true)
  createdAt   DateTime  @default(now())
}
